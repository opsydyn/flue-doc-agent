name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress so we don't leave
# the site in a half-deployed state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Must come after setup-bun: Bun prepends its own node shim to PATH,
      # so setup-node must run last to win the PATH race.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Validate environment schema
        env:
          APP_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONE_DOLLAR_STATS_API_KEY: ${{ secrets.ONE_DOLLAR_STATS_API_KEY }}
          ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
          PUBLIC_ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          PAGEVIEW_THRESHOLD: '50'
          DOCS_BASE_PATH: /flue-doc-agent
        run: bun run env:check

      - name: Build docs
        working-directory: packages/docs
        env:
          # Public — safe to expose; visible in page source regardless.
          PUBLIC_ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
        run: bun run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
