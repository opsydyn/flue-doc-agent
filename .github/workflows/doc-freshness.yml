name: Doc Freshness

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      glob:
        description: 'Glob pattern for docs to scan (relative to repo root)'
        required: false
        default: 'packages/docs/src/content/docs/**/*.md'
      pageview_threshold:
        description: '30-day page view threshold for "critical" priority'
        required: false
        default: '50'

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # keep generated report commits on top of complete local history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4  # must come after setup-bun to win PATH race
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install && echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate environment schema
        env:
          APP_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOC_FRESHNESS_SUMMARY_MODEL: gpt-4.1-nano
          ONE_DOLLAR_STATS_API_KEY: ${{ secrets.ONE_DOLLAR_STATS_API_KEY }}
          ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
          PUBLIC_ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          PAGEVIEW_THRESHOLD: ${{ github.event.inputs.pageview_threshold || '50' }}
          DOCS_BASE_PATH: /flue-doc-agent
        run: bun run env:check

      - name: Fetch analytics signals
        id: signals
        env:
          GH_TOKEN: ${{ github.token }}
          ONE_DOLLAR_STATS_API_KEY: ${{ secrets.ONE_DOLLAR_STATS_API_KEY }}
          ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
          PAGEVIEW_THRESHOLD: ${{ github.event.inputs.pageview_threshold || '50' }}
        run: |
          # GitHub Traffic API — top-10 paths, 14-day rolling window
          gh api repos/${{ github.repository }}/traffic/popular/paths \
            > /tmp/gh-traffic.json 2>/dev/null || echo "[]" > /tmp/gh-traffic.json

          # One Dollar Stats — per-page views, 30-day window
          if [ -n "$ONE_DOLLAR_STATS_API_KEY" ] && [ -n "$ODS_SITE_ID" ]; then
            curl -sf -X POST https://api.onedollarstats.com/api \
              -H "x-api-key: $ONE_DOLLAR_STATS_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"site_id\":\"$ODS_SITE_ID\",\"metrics\":[\"pageviews\"],\"date_range\":\"30d\",\"dimensions\":[\"event:page\"]}" \
              > /tmp/ods-pageviews.json || echo '{"results":[]}' > /tmp/ods-pageviews.json
          else
            echo '{"results":[]}' > /tmp/ods-pageviews.json
          fi

          # Map ODS URL paths → relative file paths, merge all signals into payload
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            const workspace = process.env.GITHUB_WORKSPACE;
            const base = '/flue-doc-agent';
            const threshold = parseInt(process.env.PAGEVIEW_THRESHOLD || '50');

            // Build slug → relative-file-path lookup from the docs content tree
            const docsRoot = path.join(workspace, 'packages/docs/src/content/docs');
            const allFiles = execSync(\`find \${docsRoot} -name '*.md' -o -name '*.mdx'\`)
              .toString().trim().split('\n').filter(Boolean);

            const slugToRelPath = {};
            for (const f of allFiles) {
              const contentRel = path.relative(docsRoot, f)
                .replace(/\.mdx?\$/, '').toLowerCase().replace(/\\\\/g, '/');
              slugToRelPath[contentRel] = path.relative(workspace, f);
            }

            // Parse responses (tolerate missing files)
            let ods = { results: [] };
            let gh = [];
            try { ods = JSON.parse(fs.readFileSync('/tmp/ods-pageviews.json', 'utf8')); } catch {}
            try { gh = JSON.parse(fs.readFileSync('/tmp/gh-traffic.json', 'utf8')); } catch {}

            // ODS: URL path (/flue-doc-agent/decisions/adr-006-.../) → relative file path
            const pageviews = {};
            for (const row of ods.results ?? []) {
              const urlPath = row.dimensions[0];
              const slug = urlPath.replace(base + '/', '').replace(/\\/\$/, '');
              if (slugToRelPath[slug]) pageviews[slugToRelPath[slug]] = row.metrics[0];
            }

            // GitHub Traffic: repo path → 14-day count (top 10 only)
            const repoTraffic = {};
            for (const row of gh ?? []) repoTraffic[row.path] = row.count;

            const signals = JSON.stringify({ pageviews, repoTraffic, pageviewThreshold: threshold });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'signals=' + signals + '\n');
          "

      - name: ODS analytics smoke test
        working-directory: agents/doc-freshness
        continue-on-error: true  # non-blocking — passes even if ODS is not yet configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONE_DOLLAR_STATS_API_KEY: ${{ secrets.ONE_DOLLAR_STATS_API_KEY }}
          ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/varlock" run --path "$GITHUB_WORKSPACE/.env.schema" -- flue run doc-freshness --target node \
            --id "analytics-${{ github.run_id }}" \
            --payload '{"mode":"analytics"}' \
            > /tmp/analytics-output.txt \
            2> /tmp/analytics.log
          cat /tmp/analytics.log
          cat /tmp/analytics-output.txt
          bun scripts/extract-flue-json.ts \
            --input /tmp/analytics-output.txt \
            --output /tmp/analytics-result.json
          jq -er '.report' /tmp/analytics-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Run doc-freshness agent
        working-directory: agents/doc-freshness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ONE_DOLLAR_STATS_API_KEY: ${{ secrets.ONE_DOLLAR_STATS_API_KEY }}
          ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
        run: |
          DOC_GLOB="${{ github.event.inputs.glob || 'packages/docs/src/content/docs/**/*.md' }}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$DOC_GLOB" in
            /*) SCAN_GLOB="$DOC_GLOB" ;;
            *) SCAN_GLOB="$GITHUB_WORKSPACE/$DOC_GLOB" ;;
          esac

          PAYLOAD=$(jq -n \
            --arg repoPath "$GITHUB_WORKSPACE" \
            --arg glob "$SCAN_GLOB" \
            --arg owner "$OWNER" \
            --arg repo "$REPO" \
            --arg ref "$GITHUB_SHA" \
            --argjson signals '${{ steps.signals.outputs.signals }}' \
            '{repoPath:$repoPath,glob:$glob,owner:$owner,repo:$repo,ref:$ref,signals:$signals}')
          "$GITHUB_WORKSPACE/node_modules/.bin/varlock" run --path "$GITHUB_WORKSPACE/.env.schema" -- flue run doc-freshness --target node \
            --id "freshness-${{ github.run_id }}" --payload "$PAYLOAD" \
            > /tmp/freshness-output.txt \
            2> /tmp/freshness.log || freshness_status=$?
          cat /tmp/freshness.log
          cat /tmp/freshness-output.txt
          if [ "${freshness_status:-0}" -ne 0 ]; then
            exit "$freshness_status"
          fi
          bun scripts/extract-flue-json.ts \
            --input /tmp/freshness-output.txt \
            --output /tmp/freshness-result.json
          jq -er '.report' /tmp/freshness-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Emit freshness annotations
        working-directory: agents/doc-freshness
        run: bun scripts/emit-github-annotations.ts --input /tmp/freshness-result.json

      - name: Generate Starlight freshness pages
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOC_FRESHNESS_SUMMARY_MODEL: gpt-4.1-nano
        run: |
          bun agents/doc-freshness/scripts/write-starlight-reports.ts \
            --ods /tmp/ods-pageviews.json \
            --freshness /tmp/freshness-result.json \
            --out packages/docs/src/content/docs/analytics

      - name: Build docs with generated reports
        working-directory: packages/docs
        env:
          PUBLIC_ODS_SITE_ID: ${{ secrets.ODS_SITE_ID }}
        run: bun run build

      - name: Commit generated freshness reports
        id: commit-reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/docs/src/content/docs/analytics
          if ! git diff --cached --quiet; then
            git commit -m "Update generated doc freshness reports"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch docs deploy
        if: steps.commit-reports.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-docs.yml --ref main

      - name: Sync critical freshness issues
        working-directory: agents/doc-freshness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/sync-github-freshness-issues.ts --input /tmp/freshness-result.json

      - name: Apply freshness gate
        run: jq -e '.shouldFail | not' /tmp/freshness-result.json > /dev/null
